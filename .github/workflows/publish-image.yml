name: Publish Image

on:
  push:
    branches: [master]
    paths:
      - "server/server.py"
      - "server/Dockerfile"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ghcr.io/harbefas/agent-code-buddy:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - uses: azure/setup-kubectl@v3
      - name: Rollout restart
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kc
          kubectl --kubeconfig /tmp/kc --server https://100.106.2.127:6443 --insecure-skip-tls-verify \
            rollout restart deployment/agent-code-buddy -n tools
