name: Publish Image

on:
  push:
    branches: [master]
    paths:
      - "server/server.py"
      - "server/Dockerfile"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ghcr.io/harbefas/agent-code-buddy:latest
